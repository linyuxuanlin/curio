name: Content check and live verification

on:
  push:
    branches:
      - main
    paths:
      - 'content/cards/**'
      - 'public/media/**'
      - 'scripts/verify-live.mjs'
      - '.github/workflows/content-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Resolve all five new card IDs
        id: cards
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CARD_PATHS < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- 'content/cards/*.json')
          if [[ "${#CARD_PATHS[@]}" -ne 5 ]]; then
            echo "Expected exactly 5 newly added card JSON files; found ${#CARD_PATHS[@]}" >&2
            exit 1
          fi
          {
            echo 'ids<<CURIO_CARD_IDS'
            for CARD_PATH in "${CARD_PATHS[@]}"; do
              CARD_ID="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(c.id)" "$CARD_PATH")"
              echo "Verifying card: $CARD_ID" >&2
              echo "$CARD_ID"
            done
            echo 'CURIO_CARD_IDS'
          } >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages and verify all five live cards
        shell: bash
        env:
          CARD_IDS: ${{ steps.cards.outputs.ids }}
        run: |
          set -euo pipefail
          mapfile -t IDS <<< "$CARD_IDS"
          if [[ "${#IDS[@]}" -ne 5 ]]; then
            echo "Expected five card IDs for live verification" >&2
            exit 1
          fi
          for CARD_ID in "${IDS[@]}"; do
            verified=0
            for attempt in $(seq 1 24); do
              echo "Live verification attempt $attempt/24 for $CARD_ID"
              if node scripts/verify-live.mjs "$CARD_ID"; then
                verified=1
                break
              fi
              if [[ "$attempt" -lt 24 ]]; then
                sleep 15
              fi
            done
            if [[ "$verified" -ne 1 ]]; then
              echo "Card not in production feed: $CARD_ID" >&2
              exit 1
            fi
          done
          echo "All 5 newly added card IDs live verified: ${IDS[*]}"
